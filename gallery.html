<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | ISAI - The Art Café</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="texture-overlay" aria-hidden="true"></div>

    <div class="page-wrapper fade-in-scale">
        <div id="navbar-container"></div>

        <main class="page-content">
            <section class="gallery-section">
                <div class="section-container">
                    <div class="text-center mb-xl">
                        <h1 class="page-title"><span class="italic-accent">Instagrammable</span> Moments</h1>
                        <p class="subtitle text-subtle">Capture the vibe. Note: These AI placeholder images will be updated with actual cafe images annually.</p>
                    </div>

                    <div class="masonry-grid">
                        <div class="gallery-item">
                            <img src="assets/images/gallery_1.png" alt="Aesthetic Cafe Corner">
                        </div>
                        <div class="gallery-item">
                            <img src="assets/images/gallery_2.png" alt="Latte Art">
                        </div>
                        <div class="gallery-item">
                            <img src="assets/images/gallery_3.png" alt="Live Music Session">
                        </div>
                        <div class="gallery-item">
                            <img src="assets/images/gallery_4.png" alt="Creative Workshop">
                        </div>
                        <!-- Reusing some menu/hero images to flesh out the gallery -->
                        <div class="gallery-item">
                            <img src="assets/images/hero_bg.png" alt="Cafe Interior">
                        </div>
                        <div class="gallery-item">
                            <img src="assets/images/french_toast.png" alt="French Toast">
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
