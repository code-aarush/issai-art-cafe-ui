<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make an Appointment | ISAI - The Art Café</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="texture-overlay" aria-hidden="true"></div>

    <div class="page-wrapper fade-in-scale">
        <div id="navbar-container"></div>

        <main class="page-content">
            <section class="booking-section bg-cream">
                <div class="section-container">
                    <div class="booking-wrapper">
                        <div class="text-center mb-xl">
                            <h1 class="page-title">Book a <span class="italic-accent">Slot</span></h1>
                            <p class="subtitle text-subtle">Reserve your spot at ISAI Art Cafe.</p>
                        </div>

                        <form action="#" method="POST" class="booking-form" id="bookingForm">
                            <div class="form-row">
                                <div class="form-group half-width">
                                    <label for="book-name">Full Name</label>
                                    <input type="text" id="book-name" required placeholder="John Doe">
                                </div>
                                <div class="form-group half-width">
                                    <label for="book-phone">Phone Number</label>
                                    <input type="tel" id="book-phone" required placeholder="+91 XXXXX XXXXX">
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group half-width">
                                    <label for="book-date">Date</label>
                                    <input type="date" id="book-date" required>
                                </div>
                                <div class="form-group half-width">
                                    <label for="book-time">Time</label>
                                    <select id="book-time" required>
                                        <option value="" disabled selected>Select a time</option>
                                        <option value="17:00">5:00 PM</option>
                                        <option value="18:00">6:00 PM</option>
                                        <option value="19:00">7:00 PM</option>
                                        <option value="20:00">8:00 PM</option>
                                        <option value="21:00">9:00 PM</option>
                                        <option value="22:00">10:00 PM</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="book-guests">Number of Guests</label>
                                <select id="book-guests" required>
                                    <option value="1">1 Person</option>
                                    <option value="2" selected>2 People</option>
                                    <option value="3">3 People</option>
                                    <option value="4">4 People</option>
                                    <option value="5">5 People</option>
                                    <option value="6">6+ People (Contact us)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="book-special">Special Requests (Optional)</label>
                                <textarea id="book-special" rows="3" placeholder="Birthday celebration, specific table preference, etc."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-large">Confirm Booking</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
    </div>

    <script src="script.js"></script>
    <script>
        // Simple client-side validation to ensure date is in the future
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('book-date');
            if(dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.setAttribute('min', today);
            }
            
            const form = document.getElementById('bookingForm');
            if(form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    alert('Thank you! Your booking request has been received. We will contact you shortly to confirm.');
                    form.reset();
                });
            }
        });
    </script>
</body>

</html>
